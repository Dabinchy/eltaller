{% extends "layouts/base_auth.html" %}
{% block title %}No encontramos la página{% endblock %}
{% block content %}
<div class="cc-auth-wrap">
  <div class="cc-auth-card text-center" role="region" aria-label="Error 404">
    <p class="display-4 fw-bold mb-1">404</p>
    <h1 class="cc-auth-title">No encontramos la página</h1>
    <p class="cc-auth-sub">El enlace puede estar mal escrito o la página ya no existe.</p>
    <a class="btn cc-auth-btn mt-2" href="/">Volver al inicio</a>
  </div>
</div>
{% endblock %}
