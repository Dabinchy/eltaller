{% extends "layouts/base_sitio.html" %}

{% block content %}
<section class="container py-5 text-center">
  <img src="{{ marca.logo }}" alt="{{ marca.nombre }}"
       style="height:180px;width:auto;max-width:100%;object-fit:contain;border-radius:10px">
  <p class="lead mt-4 mx-auto" style="max-width:680px">
    {% if empresa.descripcion_web %}{{ empresa.descripcion_web|linebreaksbr }}{% else %}Taller mecánico de competición.{% endif %}
  </p>
  <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
    <a class="btn btn-outline-light" href="{% url 'sitio:servicios' %}">Nuestros servicios</a>
    <a class="btn btn-outline-light" href="{% url 'sitio:pilotos' %}">Pilotos</a>
    <a class="btn btn-outline-light" href="{% url 'sitio:campeonatos' %}">Campeonatos</a>
  </div>
  <p class="text-body-secondary small mt-5 mb-0">
    <i class="bi bi-cone-striped me-1" aria-hidden="true"></i> Sitio en construcción.
  </p>
</section>
{% endblock %}
