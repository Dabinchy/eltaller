{% extends "layouts/base_app.html" %}

{% block content %}
<div class="container py-3" style="max-width:1000px">
  <h1 class="h4">Campeonatos</h1>
  <div class="list-group mb-4">
    {% for c in campeonatos %}
      <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{% url 'campeonatos_mod:detalle' c.pk %}">
        <span>{{ c }} <span class="small text-body-secondary">· {{ c.asociacion }}</span></span>
        <span class="badge {% if c.estado == 'EN_CURSO' %}text-bg-success{% elif c.estado == 'BORRADOR' %}text-bg-warning{% else %}text-bg-secondary{% endif %}">{{ c.get_estado_display }}</span>
      </a>
    {% empty %}
      <div class="list-group-item text-body-secondary">Todavía no hay campeonatos.</div>
    {% endfor %}
  </div>
  <div class="card"><div class="card-body">
    <h2 class="h6">Nuevo campeonato</h2>
    <form method="post" novalidate>
      {% csrf_token %}{% include "partials/_form.html" %}
      <button class="btn btn-primary" type="submit">Crear (queda en borrador)</button>
    </form>
  </div></div>
</div>
{% endblock %}
