<header class="cc-topbar" role="banner">
  <div class="cc-tb-left">
    <button class="cc-tb-btn" type="button" data-cc-flyout-toggle aria-label="Abrir menú"
            aria-controls="ccFlyout" aria-expanded="false">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div class="cc-tb-title">
      <span class="cc-tb-page">{% block topbar_title %}{{ titulo|default:"" }}{% endblock %}</span>
    </div>
  </div>

  <div class="cc-tb-right">
    <button id="themeToggle" class="cc-tb-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
      <i id="themeToggleIcon" class="bi bi-moon-stars" aria-hidden="true"></i>
    </button>

    {% if user.is_authenticated %}
      <div class="dropdown">
        <button class="cc-tb-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                aria-label="Mi cuenta">
          <i class="bi bi-person-circle" aria-hidden="true"></i>
          <span class="d-none d-md-inline ms-1">{{ user.get_full_name|default:user.username }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><span class="dropdown-item-text small text-body-secondary">{{ user.username }}</span></li>
          {% if user.is_staff and not user.es_portal %}
            <li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-gear me-2"></i>Administrador</a></li>
          {% endif %}
          <li><hr class="dropdown-divider"></li>
          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Salir</button>
            </form>
          </li>
        </ul>
      </div>
    {% endif %}
  </div>
</header>
