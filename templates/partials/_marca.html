{# Logo de la marca del área (El Taller / El Prepa). Los logos son anchos: se limita el alto. #}

     style="height:{{ alto|default:28 }}px;width:auto;max-width:{{ ancho|default:160 }}px;object-fit:contain;border-radius:4px">
