{% extends "layouts/base_app.html" %}
{# Página genérica de alta/edición. Contexto: titulo, form, volver, multipart, ayuda. #}

{% block content %}
<div class="container py-3" style="max-width:640px">
  <h1 class="h4">{{ titulo }}</h1>
  {% if ayuda %}<p class="small text-body-secondary">{{ ayuda }}</p>{% endif %}
  <form method="post" novalidate{% if multipart %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% include "partials/_form.html" %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{{ volver }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
