{% extends "layouts/base_app.html" %}

{% block content %}
<div class="container py-3" style="max-width:560px">
  <h1 class="h4">{{ titulo }}</h1>
  <p class="small text-body-secondary">Si la sucursal tiene cupo, no se aceptan más turnos superpuestos de los permitidos.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form.html" %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{% url 'taller:turnos' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
