{% if pagina.paginator.num_pages > 1 %}
  <nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Páginas">
    <span class="small text-body-secondary">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} en total</span>
    <div class="btn-group">
      {% if pagina.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring pagina=pagina.previous_page_number %}"><i class="bi bi-chevron-left" aria-hidden="true"></i> Anterior</a>{% endif %}
      {% if pagina.has_next %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring pagina=pagina.next_page_number %}">Siguiente <i class="bi bi-chevron-right" aria-hidden="true"></i></a>{% endif %}
    </div>
  </nav>
{% endif %}
